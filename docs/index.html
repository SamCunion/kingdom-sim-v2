<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Sim v2</title>
    <style>

        .SJRL2D_App {
            left: 0;
            top: 0;
        }

        #garrison-container {
            border-right: 2px solid black;
        }
        #info-container {
            border-left: 2px solid black;
        }
        li {
            list-style: none;
        }

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <main class="d-flex">
        <div id="app-container" class="w-100"></div>
        <div id="info-container" class="w-100">
            <div class="d-flex flex-column h-100">
                <h1 class="text-center">Inspector</h1>
                <h2 id="inspector-settlement-name" class="text-center"></h2>
                <div class="d-flex flex-fill">
                    <div id="garrison-container" class="w-50 d-flex flex-column">
                        <h2 class="text-center">Garrison</h2>
                        <div id="garrison-list-container" class="flex-fill">

                        </div>
                    </div>
                    <div id="field-container" class="w-50 d-flex flex-column">
                        <h2 class="text-center">Field</h2>
                        <div id="field-list-container" class="flex-fill">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="text/javascript" src="app.bundle.js"></script>
</body>
</html>
