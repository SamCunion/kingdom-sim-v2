<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Sim v2</title>
    <style>

        main {
            height: 100%;
            width: 100%;
            position: absolute;
            overflow: hidden;
            background-color: #1e1b1b;
            color: white;
        }
        label {
            -moz-user-select: none;
            user-select: none;
        }
        #inspector-container {
            width: 40%;
            min-height: 100%;
        }
        #control-container {
            min-height: 10%;
        }
        #garrison-container {
            border-right: 5px ridge rgb(255, 157, 0);
        }
        #settlement-container {
            min-height: 50%;
        }
        #field-container {
            min-width: 50%;
        }
        #field-list, #garrison-list {
            overflow-y: scroll;
        }
        #kingdom-info-container {
            min-height: 25%
        }
        #event-log-container {
            min-height: 15%;
            overflow-y: scroll;
        }
        #kingdom-selector {
            border-right: 5px ridge rgb(255, 157, 0);
            overflow-y: scroll;
        }
        #kingdom-info {
            overflow-y: scroll;
        }
        #kingdom-list {
            border-radius: 0%;
        }
        #kingdom-list li {
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            -moz-user-select: none;
            background-color: #373636;
        }
        .active {
            background-color: #636262 !important;
            border-color: white !important;
        }
        .inspector-segment {
            border-top: 5px ridge rgb(255, 157, 0);
            border-right: 5px ridge rgb(255, 157, 0);
            border-left: 5px ridge rgb(255, 157, 0);
        }
        .inspector-segment:last-of-type {
            border-bottom: 5px ridge rgb(255, 157, 0);
        }
        .btn-play {
            background-color: #a5ff81 !important;
        }
        .btn-play:hover, .btn-pause:hover {
            color: #212529 !important;
        }
        .btn-pause {
            background-color: #ff6b6b !important;
        }
        .btn-step {
            background-color: #183ea5 !important;
            color: white !important;
        }

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <main class="d-flex">
        <div id="app-container">

        </div>
        <div id="inspector-container" class="d-flex flex-column justify-content-between h-100">
            <div id="control-container" class="inspector-segment d-flex justify-content-center">
                <div class="d-flex justify-content-between p-3 my-auto" style="width: 60%">
                    <div id="slider-container" class="d-flex flex-column">
                        <label for="speed-slider" class="mx-auto">Speed: <span id="speed-value">1</span>x</label>
                        <input type="range" class="form-range" id="speed-slider" min="1" max="10" step="1" value="1" />
                    </div>
                    <button class="btn btn-lg btn-play" id="play-button">Play</button>
                    <button class="btn btn-lg btn-step" id="step-button">Step</button>
                </div>
            </div>
            <div id="settlement-container" class="inspector-segment h-100 d-flex">
                <div id="garrison-container" class="w-50 ps-2 d-flex flex-column">
                    <h2>Garrison <span id="inspector-settlement-name" class="h4"></span></h2>
                    <div id="garrison-list">

                    </div>
                </div>
                <div id="field-container" class="w-auto ps-2 d-flex flex-column">
                    <h2>Field</h2>
                    <div id="field-list">

                    </div>
                </div>
            </div>
            <div id="kingdom-info-container" class="inspector-segment h-100 d-flex">
                <div id="kingdom-selector" class="w-50">
                    <ul id="kingdom-list" class="list-group">

                    </ul>
                </div>
                <div id="kingdom-info" class="w-50">

                </div>
            </div>
            <div id="event-log-container" class="inspector-segment h-100">
                <ul id="notification-list">

                </ul>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="text/javascript" src="app.bundle.js"></script>
</body>
</html>
